[project]
name = "literasy-backend"
version = "0.2.0"
description = "Backend FastAPI aplikasi Literasy: Busur & Juring"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() di argumen default adalah pola resmi FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tabel parametrize boleh panjang
